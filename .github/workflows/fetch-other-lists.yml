name: Fetch US OFAC and HK CEDB lists

# Runs every Monday 04:30 Hong Kong time (Sunday 20:30 UTC), after the UN list job,
# and on demand. Separate from the UN job so a problem here never affects it.
on:
  schedule:
    - cron: "30 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lists-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and build OFAC + HK CEDB lists
        run: python scripts/build_other_lists.py

      - name: Commit if changed
        run: |
          git config user.name "ion-kyc-bot"
          git config user.email "ion-kyc-bot@users.noreply.github.com"
          git add other/
          git commit -m "OFAC/HK lists $(date -u +%F)" || echo "No changes"
          git pull --rebase
          git push
